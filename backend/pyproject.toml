[project]
name = "breaking-bread-backend"
version = "0.1.0"
description = "Breaking Bread API: link -> recipe -> grocery list, cost, macros, and guidance"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx2>=2.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
